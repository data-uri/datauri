<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded rectangle -->
  <rect x="20" y="20" width="160" height="160" rx="30" ry="30" fill="#f5f0e8" stroke="#3a4a5c" stroke-width="8"/>

  <!-- Main D letter -->
  <path d="M70 60 L70 140 L110 140 C130 140 145 125 145 105 L145 95 C145 75 130 60 110 60 Z M85 75 L110 75 C120 75 130 85 130 95 L130 105 C130 115 120 125 110 125 L85 125 Z" fill="#3a4a5c"/>

  <!-- Connection points and lines -->
