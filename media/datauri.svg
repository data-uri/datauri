  <circle cx="40" cy="50" r="6" fill="#ff6b35" stroke="#3a4a5c" stroke-width="2"/>
  <line x1="46" y1="50" x2="60" y2="50" stroke="#3a4a5c" stroke-width="3"/>
  <rect x="60" y="45" width="8" height="8" fill="#ff6b35" stroke="#3a4a5c" stroke-width="1"/>

